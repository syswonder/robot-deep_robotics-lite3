# Lite3 RTAB-Map parameters. MID-360 ICP owns the private odom_icp trajectory;
# the deployment bridge converts its corrected map pose to Nav2's chassis-owned
# odom frame without creating a second odom -> base_link TF publisher.
RGBD/CreateOccupancyGrid: true

# Use only MID-360 to build the 2D occupancy grid. Orbbec RGB-D remains
# available to RTAB-Map and scene perception, but does not write a second,
# extrinsic-sensitive representation of the same walls into the Nav2 map.
Grid/Sensor: 0
Grid/FromDepth: false
Grid/RangeMax: 6.0
Grid/RangeMin: 0.25
Grid/CellSize: 0.05
Grid/RayTracing: true
Grid/3D: false
Grid/NormalsSegmentation: true

# These are the values used by the previous Lite3 rtabmap_rbnx deployment.
# The 0.25 m near-field cutoff also rejects more body/leg returns while walking.
Grid/MaxObstacleHeight: 1.5
Grid/MaxGroundHeight: 0.1

# Official static length/width are 0.61 x 0.37 m. Use the larger authoritative
# gait-aware envelope declared in soma.yaml to remove body/leg returns before
# writing the occupancy grid.
Grid/FootprintLength: 0.68
Grid/FootprintWidth: 0.46

# Use MID-360 ICP for pose registration; RGB-D remains enabled for occupancy
# generation. Force3DoF prevents gait roll/pitch from bending the map.
Reg/Strategy: 1
Reg/Force3DoF: true
Optimizer/Strategy: 1
Optimizer/GravitySigma: 0
RGBD/NeighborLinkRefining: true
RGBD/ProximityBySpace: true
# Limit spatial proximity search to the nearest path neighbor. This preserves
# useful corridor loop closures while reducing ambiguous parallel-wall links.
RGBD/ProximityPathMaxNeighbors: 1
RGBD/AngularUpdate: 0.05
RGBD/LinearUpdate: 0.05
# Mem/IncrementalMemory remains mode-owned by service-map-rbnx: true while
# mapping and false while localizing. Do not override it in this shared file.
Mem/NotLinkedNodesKept: true
Vis/MinInliers: 12
Vis/MaxDepth: 3.0
# At the recommended 0.10-0.15 m/s manual mapping speed, 1 Hz gives 10-15 cm
# between updates while leaving enough Jetson capacity for RGB-D/scan-cloud
# synchronization and ICP odometry.
Rtabmap/DetectionRate: 1.0

Icp/MaxCorrespondenceDistance: 0.2
Icp/MaxTranslation: 0.5
Icp/MaxRotation: 0.78

# Seed each scan-to-scan ICP update with the chassis odometry increment. ICP
# still publishes the independent odom_icp trajectory used by RTAB-Map.
guess_frame_id: odom
