planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
    tf_buffer_duration: 0.5  # seconds


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    # min_x_velocity_threshold: 0.01
    # min_y_velocity_threshold: 0.01
    # min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    # Goal checker parameters
    general_goal_checker:
      # Lite3 gait and odometry can move the reported pose during an in-place
      # turn. Preserve terminal state across global replans and use hysteresis
      # so a small pose wobble cannot re-enable translation.
      plugin: "robonix_nav2_terminal::PersistentGoalChecker"
      xy_enter_tolerance: 0.15
      xy_exit_tolerance: 0.25
      yaw_enter_tolerance: 0.12
      yaw_exit_tolerance: 0.20
      stopped_linear_velocity: 0.05
      stopped_angular_velocity: 0.05
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.00
      min_vel_y: 0.0
      max_vel_x: 0.22
      max_vel_y: 0.0
      max_vel_theta: 0.5
      # min_vel_theta: 0.05
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      # Zero must be a valid sample so the terminal latch can settle without
      # oscillating around a forced non-zero angular velocity.
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: -0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 120
      sim_time: 3.0
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.12
      # trans_stopped_velocity: 0.15
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["PersistentRotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.05
      PathAlign.scale: 1.0
      # PathAlign.forward_point_distance: 0.1
      # PathAlign.forward_preference: true
      GoalAlign.scale: 0.2
      # GoalAlign.forward_point_distance: 0.1
      # GoalAlign.forward_preference: true
      PathDist.scale: 0.5
      GoalDist.scale: 2.0
      # Lite3-specific terminal rotation: latch XY/yaw independently across
      # replans, tolerate gait-induced pose wobble, and cap the final turn below
      # the normal 0.5 rad/s navigation limit.
      PersistentRotateToGoal.class: "robonix_nav2_terminal::PersistentRotateToGoalCritic"
      PersistentRotateToGoal.xy_enter_tolerance: 0.15
      PersistentRotateToGoal.xy_exit_tolerance: 0.25
      PersistentRotateToGoal.yaw_enter_tolerance: 0.12
      PersistentRotateToGoal.yaw_exit_tolerance: 0.20
      PersistentRotateToGoal.stopped_linear_velocity: 0.05
      PersistentRotateToGoal.max_terminal_angular_velocity: 0.25
      PersistentRotateToGoal.slowing_factor: 3.0
      PersistentRotateToGoal.lookahead_time: 0.5
      PersistentRotateToGoal.max_terminal_duration: 20.0
      PersistentRotateToGoal.no_progress_timeout: 4.0
      PersistentRotateToGoal.min_yaw_progress: 0.04
      PersistentRotateToGoal.rotation_margin: 0.50


bt_navigator:
  ros__parameters:
    use_sim_time: false
    bt_loop_duration: 50
    default_server_timeout: 1000
    default_bt_xml_filename: "__ROBONIX_BT_XML__"
    default_nav_to_pose_bt_xml: "__ROBONIX_BT_XML__"
    tf_buffer_duration: 0.5

recoveries_server:
  ros__parameters:
    costmap_topic: global_costmap/costmap
    footprint_topic: global_costmap/published_footprint

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [0.34, 0.23], [0.34, -0.23], [-0.34, -0.23], [-0.34, 0.23] ]"
      footprint_padding: 0.13
      # robot_radius: 0.32

      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scanner/scan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          qos:
            reliability: best_effort
            durability: volatile

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.40
        cost_scaling_factor: 2.2


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map          # usually 'map'
      robot_base_frame: base_link
      # robot_radius: 0.32
      footprint: "[ [0.34, 0.23], [0.34, -0.23], [-0.34, -0.23], [-0.34, 0.23] ]"
      footprint_padding: 0.13
      update_frequency: 1.0      # update rate (Hz); may be lower than local_costmap
      publish_frequency: 1.0     # publish rate (Hz)
      resolution: 0.05           # resolution; match the map

      rolling_window: false      # global costmap: keep rolling_window false
      track_unknown_space: true  # treat unknown space as plan:able
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scanner/scan
          max_obstacle_height: 2.0
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.60
        cost_scaling_factor: 2.2


lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - bt_navigator
      - recoveries_server
