planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      allow_unknown: false
    tf_buffer_duration: 0.5  # 秒


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    # min_x_velocity_threshold: 0.01
    # min_y_velocity_threshold: 0.01
    # min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.6
      # min_vel_theta: 0.05
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.05
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: -0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 120
      sim_time: 3.0
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      # trans_stopped_velocity: 0.15
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.015
      PathAlign.scale: 1.0
      # PathAlign.forward_point_distance: 0.1
      # PathAlign.forward_preference: true
      GoalAlign.scale: 0.2
      # GoalAlign.forward_point_distance: 0.1
      # GoalAlign.forward_preference: true
      PathDist.scale: 0.5
      GoalDist.scale: 2.0
      RotateToGoal.xy_goal_tolerance: 0.20
      RotateToGoal.yaw_goal_tolerance: 0.20
      RotateToGoal.scale: 0.6
      RotateToGoal.slowing_factor: 1.0
      RotateToGoal.lookahead_time: 0.5


bt_navigator:
  ros__parameters:
    use_sim_time: false
    default_bt_xml_filename: "__ROBONIX_BT_XML__"
    tf_buffer_duration: 0.5

recoveries_server:
  ros__parameters:
    costmap_topic: global_costmap/costmap
    footprint_topic: global_costmap/published_footprint

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [0.34, 0.23], [0.34, -0.23], [-0.34, -0.23], [-0.34, 0.23] ]"
      footprint_padding: 0.05
      # robot_radius: 0.32

      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scanner/scan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          qos:
            reliability: best_effort
            durability: volatile

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map          # 通常是 map
      robot_base_frame: base_link
      # robot_radius: 0.32
      footprint: "[ [0.34, 0.23], [0.34, -0.23], [-0.34, -0.23], [-0.34, 0.23] ]"
      footprint_padding: 0.05
      update_frequency: 1.0      # 更新频率（Hz），比 local_costmap 低即可
      publish_frequency: 1.0     # 发布频率
      resolution: 0.05           # 分辨率，建议和地图一致

      rolling_window: false      # 🚫 不要滚动，通常设置为 false
      track_unknown_space: true  # 路径规划时是否考虑未知区域
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scanner/scan
          max_obstacle_height: 2.0
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 2.00


lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - bt_navigator
      - recoveries_server
