manifestVersion: 1
name: robonix-lite3-deploy

catalog:
  name: robonix.robot.deep_robotics.lite3
  version: 0.2.0
  description: Minimal Robonix deployment for the Deep Robotics Lite3.
  tags: [robot, deploy, deep_robotics, lite3, quadruped, jetson, lidar, rgbd, mapping, navigation]

env:
  ROS_DOMAIN_ID: "0"
  RBNX_BUILD_TARGET: jetson-native
  ROBONIX_SCENE_FORCE: native
  ROBONIX_SCENE_PLATFORM: jetson_orin
  ROBONIX_SCENE_ROS_DISTRO: humble
  SCENE_NATIVE_PYTHON: python3
  SCENE_WEB_PORT: "50107"
  ROBONIX_MAPPING_FORCE: native
  ROBONIX_MAPPING_PLATFORM: jetson_orin
  MAPPING_WEBUI_PORT: "8091"
  ROBONIX_NAV2_FORCE: native
  ROBONIX_NAV2_PLATFORM: jetson_orin
  SCENE_MAP_ID: lite3_lab
  MAPPING_MAPS_DIR: ${HOME}/.robonix/maps

system:
  atlas: {listen: 127.0.0.1:50051, log: info}
  executor: {listen: 127.0.0.1:50061, log: info}
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison: {listen: 127.0.0.1:50081, log: info}
  soma:
    listen: 127.0.0.1:50091
    provider_id: soma
    robot_yaml: ${ROBONIX_DEPLOY_DIR}/soma.yaml
    log: info
  scene: {log: info}

primitive:
  - name: lite3_quadruped
    url: https://github.com/syswonder/primitive-deep_robotics-lite3_quadruped.git
    branch: main
    config:
      odom_frame: odom
      base_frame: base_link
      odom_topic: /odom
      odom_rate_hz: 20.0
      target_ip: 192.168.1.120
      target_port: 43893
      local_port: 43897
      app_port: 43899
      sentinel_timeout_s: 30.0

  - name: mid360_lidar
    # The Ranger Mini remote package currently lacks package.vendor required
    # by this Robonix CLI. Use the validated Lite3 package until it is updated.
    path: ../lite3_rbnx_ws/primitives/mid360_lidar_rbnx
    config:
      lidar_topic: /scanner/cloud
      imu_topic: /livox/imu
      lidar_ip: 192.168.1.3
      xfer_format: 0
      sentinel_timeout_s: 45.0

  - name: lite3_description
    url: https://github.com/syswonder/primitive-deep_robotics-lite3_description.git
    branch: main
    config:
      urdf_path: deep_robotics_model/Lite3/Lite3_urdf/urdf/Lite3.urdf

  - name: orbbec_camera
    url: https://github.com/syswonder/primitive-orbbec-camera.git
    branch: main
    config:
      camera_name: camera
      camera_model: gemini330_series
      color_profile: 640x480x15
      depth_profile: 640x480x15
      depth_registration: true
      enable_color: true
      enable_depth: true
      enable_point_cloud: false
      enable_imu: false
      sentinel_timeout_s: 45.0

service:
  - name: pcld2lscan
    url: https://github.com/syswonder/service-pcld2lscan-rbnx.git
    branch: main
    config:
      scan_frame: livox_frame
      scan_rate_hz: 10.0

  # Use the Lite3 RTAB-Map wrapper. The Ranger service-map package is left
  # untouched because its generated ListMaps API is incompatible with the
  # currently installed Robonix code generator.
  - name: rtabmap
    path: ../lite3_rbnx_ws/services/rtabmap_rbnx
    config:
      base_frame: base_link
      odom_frame: odom
      map_frame: map
      use_sim_time: false
      subscribe_rgbd: true
      subscribe_scan_cloud: true
      # Lite3 is the sole odom -> base_link authority. Do not start RTAB-Map's
      # RGB-D odometry, which would create a competing TF publisher.
      subscribe_odom: true
      odom_topic: /odom
      rgb_topic: /camera/color/image_raw
      depth_topic: /camera/depth/image_raw
      camera_info_topic: /camera/color/camera_info
      scan_cloud_topic: /scanner/cloud
      approx_sync: true
      sentinel_timeout_s: 45.0
      slam_args: "-d"
      localization: false
      enable_viz: false

  - name: nav2
    url: https://github.com/syswonder/service-navigation-rbnx.git
    branch: main
    manifest: package_manifest.jetson-native.yaml
    config:
      # RTAB-Map publishes the live /map; do not start the default profile's
      # AMCL/map_server localization stack on top of an online SLAM map.
      params_profile: slam
      use_sim_time: false
      action_wait_s: 90.0

skill: []
